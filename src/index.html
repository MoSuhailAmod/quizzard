<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quizzard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section id="home" class="screen">
      <h1>Quizzard</h1>
      <p class="tagline">Grade 12 practice quizzes</p>
      <button id="start" type="button" class="primary">Start practising</button>
    </section>

    <section id="practise" class="screen" hidden>
      <h2>Choose a subject</h2>
      <p id="practise-message">Subjects will appear here once questions are added to the question bank.</p>
      <button id="back" type="button">Back</button>
    </section>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
