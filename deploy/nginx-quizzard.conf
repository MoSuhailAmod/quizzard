# nginx site for Quizzard. Copy to /etc/nginx/sites-available/quizzard (see docs/deploy.md).
#
# It listens on 127.0.0.1 only, so nothing on the home network can reach it directly.
# `tailscale serve` is what exposes it, and only to the tailnet.
server {
    listen 127.0.0.1:8080;
    server_name _;

    root /var/www/quizzard;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;

        # The files have no version in their names, so make browsers re-check after every redeploy.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
